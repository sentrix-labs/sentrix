[package]
name = "sentrix-evm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EVM execution layer (revm 38) for Sentrix blockchain"
repository.workspace = true

[dependencies]
sentrix-primitives = { path = "../sentrix-primitives" }
sentrix-precompiles = { path = "../sentrix-precompiles" }
revm = { version = "40", default-features = false, features = ["std", "serde", "optional_balance_check", "optional_no_base_fee"] }
alloy-primitives = "1.6"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.11"
tracing = "0.1"
