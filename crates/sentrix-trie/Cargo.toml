[package]
name = "sentrix-trie"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binary Sparse Merkle Tree (256-level) with MDBX persistence for Sentrix blockchain state"
repository.workspace = true

[dependencies]
sentrix-primitives = { path = "../sentrix-primitives" }
sentrix-storage = { path = "../sentrix-storage" }
lru = "0.18"
sha2 = "0.11"
blake3 = "1.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
bincode = "1.3"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Criterion-based microbenches for the trie hot path. Run locally with
#   cargo bench --bench trie_insert
# CI runs them on every PR touching consensus crates and compares against
# the main-branch baseline (see .github/workflows/benchmark.yml).
[[bench]]
name = "trie_insert"
harness = false
