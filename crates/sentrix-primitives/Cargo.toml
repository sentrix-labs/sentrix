[package]
name = "sentrix-primitives"
version = "2.1.82"
edition = "2024"
license = "BUSL-1.1"
description = "Core types and error handling for Sentrix blockchain"
repository = "https://github.com/sentrix-labs/sentrix"
keywords = ["blockchain", "sentrix", "types"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
secp256k1 = { version = "0.31", features = ["rand", "recovery", "serde"] }
sha2 = "0.11"
sha3 = "0.11"
hex = "0.4"

[dev-dependencies]
# Property-based testing for AccountDB invariant sweeps. See
# `tests/account_proptest.rs` — generates random op sequences and
# asserts `total_supply()` and `total_burned` match an independent
# ledger model. Catches the H3-class supply leak (audit 2026-05-06)
# at the unit level before it ships.
proptest = "1"
