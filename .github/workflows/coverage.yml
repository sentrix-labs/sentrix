name: Coverage

# Coverage runs on every push to main + every PR. Sentrix is workspace-
# wide Rust + revm; cargo-tarpaulin's ptrace engine trips a const-eval
# bug inside the ruint crate when instrumenting revm's dep tree
# (verified locally 2026-05-06). cargo-llvm-cov uses LLVM source-based
# coverage instead — the same engine cargo-tarpaulin's `--engine llvm`
# flag wraps — with cleaner setup, no const-eval interaction, and
# direct Codecov upload via lcov.
#
# Scope: EVM-free crates only for now (primitives, bft, staking,
# trie, codec, wallet, nft). The EVM-touching set (sentrix-evm, sentrix-
# precompiles, sentrix-core, sentrix-rpc, sentrix-network, sentrix-
# grpc, sentrix-storage, bin/sentrix) compiles and tests fine but
# llvm-cov instrumentation against the revm dep tree is brittle on
# CI runners; revisit when we drop a revm version that ships
# explicit const-eval guard.
#
# sentrix-nft (pure Proof Asset domain crate, no revm) is in-scope. Note
# the native-NFT *apply path* (dispatch + block wiring) lives in
# sentrix-core, which is in the EVM-excluded set — those tests still run
# in ci.yml's `cargo test`, they're just not in this coverage upload
# until the EVM crates can be instrumented on CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  llvm-cov:
    name: cargo-llvm-cov
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable + llvm-tools-preview
        run: |
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cov-${{ runner.os }}-

      - name: Run coverage on EVM-free crates
        run: |
          cargo llvm-cov \
            --package sentrix-primitives \
            --package sentrix-bft \
            --package sentrix-staking \
            --package sentrix-trie \
            --package sentrix-codec \
            --package sentrix-wallet \
            --package sentrix-nft \
            --package sentrix-prom-exporter \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '/(tests|benches)/'

      - name: Coverage summary
        run: |
          cargo llvm-cov report \
            --package sentrix-primitives \
            --package sentrix-bft \
            --package sentrix-staking \
            --package sentrix-trie \
            --package sentrix-codec \
            --package sentrix-wallet \
            --package sentrix-nft \
            --package sentrix-prom-exporter \
            --summary-only

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          # `main` on this repo is branch-protected, and Codecov v4 rejects
          # tokenless upload to protected branches ("Token required because
          # branch is protected") — even on public repos. Token must be
          # configured at GitHub → Settings → Secrets and variables →
          # Actions → New repository secret `CODECOV_TOKEN`, value taken
          # from codecov.io after enabling the repo. With the secret unset
          # the upload step warns + skips; the workflow itself stays green.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload lcov.info as artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 30
