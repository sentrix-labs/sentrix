name: nightly-testnet

# Boots a fresh multi-validator testnet from genesis on loopback, lets it
# produce blocks, and asserts every validator converges on the same block hash
# (real BFT + libp2p + block production — the layer the in-process tests can't
# reach). NOT a PR gate: runs on a schedule + manual dispatch only, so a flaky
# network run never blocks a merge. The deterministic state_root/consensus
# invariants stay guarded by the in-process tests in `cargo test`.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence:
    name: testnet convergence smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install protoc (protobuf-compiler)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-u2204-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build node binary
        run: cargo build --release -p sentrix-node --bin sentrix

      - name: Run testnet convergence smoke
        env:
          SENTRIX_BIN: ./target/release/sentrix
          VALIDATORS: "3"
          TARGET_HEIGHT: "20"
          TIMEOUT: "300"
        run: bash scripts/ci-testnet-convergence.sh
